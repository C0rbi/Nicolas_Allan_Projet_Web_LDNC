spring.application.name=ldnc

# --- Base de données PostgreSQL ---
# Les tables sont créées par les scripts du dossier database/ (01_structure.sql puis 02_donnees.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/ldncdb
spring.datasource.username=postgres
# ${DB_PASSWORD:pablo} : variable d'environnement DB_PASSWORD si elle existe, sinon "pablo" (poste de développement)
spring.datasource.password=${DB_PASSWORD:pablo}

# Hibernate ne modifie jamais la structure de la base : c'est le rôle des scripts SQL
spring.jpa.hibernate.ddl-auto=none
# La connexion à la base est fermée à la fin de chaque service (bonne pratique)
spring.jpa.open-in-view=false
# Affiche les requêtes SQL générées par Hibernate dans la console (pratique pour déboguer)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Sécurité ---
# Clé secrète qui signe les tokens JWT (32 caractères minimum). En production : variable d'environnement JWT_SECRET
ldnc.jwt.secret=${JWT_SECRET:cle-de-developpement-ldnc-a-changer-en-production}
# Durée de validité d'un token : l'utilisateur doit se reconnecter après ce délai
ldnc.jwt.duree-minutes=120
# Adresse du site Angular autorisée à appeler l'API (CORS)
ldnc.front.url=http://localhost:4200
