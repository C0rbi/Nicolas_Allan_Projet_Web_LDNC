# Profil "test" : les tests utilisent une base H2 en mémoire (pas besoin de PostgreSQL).
# Hibernate crée les tables à partir des entités au démarrage et les supprime à la fin.
spring.datasource.url=jdbc:h2:mem:ldnc-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
