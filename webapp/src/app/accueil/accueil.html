<section class="carrousel conteneur">
  <img [src]="images[indexImage()]" alt="Offre du moment">
  <button class="fleche gauche" (click)="precedente()" aria-label="Image précédente">‹</button>
  <button class="fleche droite" (click)="suivante()" aria-label="Image suivante">›</button>
  <div class="points">
    @for (image of images; track image; let i = $index) {
      <button [class.actif]="i === indexImage()" (click)="afficher(i)" [attr.aria-label]="'Image ' + (i + 1)"></button>
    }
  </div>
</section>

<section class="conteneur">
  <div class="titre-section">
    <h2>Nos nouveautés</h2>
    <a routerLink="/produits" [queryParams]="{ tri: 'nouveautes' }">Voir tous les produits ›</a>
  </div>

  <div class="grille">
    @for (produit of nouveautes(); track produit.id) {
      <a class="vignette" [routerLink]="['/produits', produit.id]">
        <img [src]="produit.imageUrl || 'produits/aucune-image.svg'" [alt]="produit.nom">
        <span class="marque">{{ produit.marque?.nom }}</span>
        <span class="nom">{{ produit.nom }}</span>
        <app-stock [stock]="produit.stock" />
        <span class="prix">{{ produit.prixTtc | currency: 'EUR' }}</span>
      </a>
    }
  </div>
</section>
